laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

workbench:
  start: '/admin/icon-demo'
  install: true
  discovers:
    web: false
    views: false
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets: []
